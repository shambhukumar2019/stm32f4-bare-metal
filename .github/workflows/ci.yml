name: build blinky project

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Install build tool
        run: sudo apt install gcc-arm-none-eabi -y
      
        
      - name: Build blinky project
        run: cmake --preset debug && cmake --build --preset debug

